name: mirantis-publish

# Builds and pushes the downstream Mirantis promxy image when a `-mirantis` tag
# is pushed (e.g. v0.0.96-mirantis.1). Upstream release tags (v0.0.96, ...) do
# NOT match this filter, so they are never republished to the Mirantis registry.
#
# Required repository configuration on mirantis/promxy (set by OSPO/IT):
#   Variables:
#     REGISTRY     registry host, e.g. quay.io   (used for docker login)
#     IMAGE_NAME   namespace/repo, e.g. mirantis/promxy
#   Secrets:
#     REGISTRY_USERNAME
#     REGISTRY_PASSWORD

on:
  push:
    tags:
      - '*-mirantis*'

permissions:
  contents: read

jobs:
  publish:
    # Only ever runs on the mirror/fork, never on the canonical upstream repo.
    if: github.repository != 'jacksontj/promxy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Mirantis registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}
          # Reuse the Go build cache + image layers across runs (pairs with the
          # cache mounts in the Dockerfile) so the multi-arch build doesn't
          # recompile promxy + vendor from scratch every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
