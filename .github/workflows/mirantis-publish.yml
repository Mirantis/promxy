name: mirantis-publish

# Builds and pushes the downstream Mirantis promxy image to GHCR when a
# `-mirantis` tag is pushed (e.g. v0.0.96-mirantis.1). Upstream release tags
# (v0.0.96, ...) do NOT match this filter, so they are never republished.
#
# Auth uses the repo's built-in GITHUB_TOKEN: it can push packages under
# ghcr.io/mirantis because this repo lives in that org, so no external registry
# secret is required.
#
# NOTE: the package is created PRIVATE on first push. An org admin must set
# ghcr.io/mirantis/promxy to public so kof can pull it without an image pull
# secret.

on:
  push:
    tags:
      - '*-mirantis*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only ever runs on the mirror/fork, never on the canonical upstream repo.
    if: github.repository != 'jacksontj/promxy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mirantis/promxy:${{ github.ref_name }}
          # Reuse the Go build cache + image layers across runs (pairs with the
          # cache mounts in the Dockerfile) so the multi-arch build doesn't
          # recompile promxy + vendor from scratch every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
